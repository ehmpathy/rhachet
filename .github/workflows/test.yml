name: test

on:
  workflow_call:
  push:
    branches-ignore:
      - main # exclude main branch, since deploy workflow triggers on main, and calls the test workflow inside of it already
    tags-ignore:
      - v* # exclude tags, since deploy workflow triggers on tags, and calls the test workflow inside of it already

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # per [workflow] x [branch, tag]
  cancel-in-progress: true #  cancel workflows for non-latest commits

permissions:
  id-token: write # required for oidc
  contents: read

jobs:
  suite:
    uses: ./.github/workflows/.test.yml
    with:
      creds-aws-region: us-east-1
      creds-aws-role-arn: arn:aws:iam::805192865516:role/ehmpathy-demo-oidc # aws auth via oidc — the shared ehmpathy demo role (mirrors declastruct-aws) so aws.params integration tests reach real ssm
    secrets: inherit # keyrack firewall filters to keys declared in .agent/keyrack.yml
